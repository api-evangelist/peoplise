name: Peoplise
description: >-
  Peoplise (now Logo Peoplise) is a Turkish human-resources technology SaaS that
  digitalizes recruitment and hiring workflows for enterprises. The platform
  covers the full talent-acquisition funnel: candidate sourcing and application
  tracking, automated pre-screening and assessments, one-way and live video
  interviews, reference checking, and digital onboarding. Originally a 500 Global
  (500 Startups) portfolio company, Peoplise was acquired by Logo (Logo Yazilim),
  one of Turkey's largest enterprise-software vendors, and is marketed as "Logo
  Peoplise" at logo.com.tr. Public probing found a marketing/product site only;
  no developer portal, OpenAPI/Swagger specification, /.well-known/ discovery
  surface, or documented public API was found at this time.
